name: MeowChess
options:
  bundleIdPrefix: com.julius201
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MeowChess:
    type: application
    platform: iOS
    sources:
      - path: MeowChess
        excludes: [Sounds]
      # Unique pack_event names are copied into the bundle without folder ambiguity.
      - path: MeowChess/Sounds
        buildPhase: resources
    dependencies:
      - framework: ChessCore.xcframework
        embed: false
      - sdk: Charts.framework
    info:
      path: MeowChess/Info.plist
      properties:
        CFBundleDisplayName: Meow Chess
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets Meowy AI reach a model running on the player's own computer (e.g. Ollama over http).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Meow Chess connects to an AI model running on your own computer, if you set one up in Settings.
        # Only HTTPS and the Keychain, both exempt; skips the export compliance question in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julius201.meowchess
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meow Chess
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MeowChessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MeowChessTests
    dependencies:
      - target: MeowChess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julius201.meowchess.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
  MeowChessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MeowChessUITests
    dependencies:
      - target: MeowChess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julius201.meowchess.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: MeowChess
schemes:
  MeowChess:
    build:
      targets:
        MeowChess: all
        MeowChessTests: [test]
        MeowChessUITests: [test]
    test:
      targets:
        - MeowChessTests
        - MeowChessUITests
