name: MeowChess
options:
  bundleIdPrefix: com.julius201
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MeowChess:
    type: application
    platform: iOS
    sources:
      - MeowChess
    dependencies:
      - framework: ChessCore.xcframework
        embed: false
      - sdk: Charts.framework
    info:
      path: MeowChess/Info.plist
      properties:
        CFBundleDisplayName: Meow Chess
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets Meowy AI reach a model running on the player's own computer (e.g. Ollama over http).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Meow Chess connects to an AI model running on your own computer, if you set one up in Settings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julius201.meowchess
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meow Chess
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  MeowChessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MeowChessUITests
    dependencies:
      - target: MeowChess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julius201.meowchess.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: MeowChess
schemes:
  MeowChess:
    build:
      targets:
        MeowChess: all
        MeowChessUITests: [test]
    test:
      targets:
        - MeowChessUITests
